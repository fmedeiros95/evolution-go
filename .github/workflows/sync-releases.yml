name: Sync Releases

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: releases-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release package
    if: github.repository == 'fmedeiros95/evolution-go'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: evolution-go-manager/pnpm-lock.yaml

      - name: Set release version
        id: release
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_BRANCH" == develop ]]; then
            version="${version}-beta.${GITHUB_SHA:0:12}"
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build manager
        working-directory: evolution-go-manager
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test application
        run: |
          go test ./...
          go vet ./...
          go run ./tools/check-api-docs

      - name: Package tracked source and pinned whatsmeow
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          package="evolution-go-${RELEASE_VERSION}"
          stage="$RUNNER_TEMP/release/$package"
          mkdir -p "$stage/whatsmeow-lib" dist
          git archive HEAD | tar -x -C "$stage"
          git -C whatsmeow-lib archive HEAD | tar -x -C "$stage/whatsmeow-lib"
          # Ship the freshly built manager and embedded dependency, without Git metadata.
          rm -rf "$stage/manager/dist"
          rm -f "$stage/.gitmodules"
          mkdir -p "$stage/manager"
          cp -R evolution-go-manager/dist "$stage/manager/dist"
          printf '%s\n' "$RELEASE_VERSION" > "$stage/VERSION"
          (cd "$stage" && go build -ldflags "-X main.version=$RELEASE_VERSION" -o "$RUNNER_TEMP/release-check" ./cmd/evolution-go)
          tar -czf "dist/$package.tar.gz" -C "$RUNNER_TEMP/release" "$package"
          (cd dist && sha256sum "$package.tar.gz" > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to fork releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.tag }}
          path: dist

      - name: Publish immutable release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-runs never move tags or replace assets. Main needs a VERSION bump
          # for another release; develop has one unique beta tag per commit.
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::notice::Tag $RELEASE_TAG already exists; keeping the published version."
            exit 0
          fi
          (cd dist && sha256sum -c SHA256SUMS)
          flags=(--latest)
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
          fi
          printf 'Source: %s/tree/%s\n\nIncludes the built Manager and the pinned whatsmeow source.\n' \
            "$GITHUB_SERVER_URL/$GH_REPO" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
